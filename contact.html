<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio - Kontak</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="portfolio.html">Portfolio</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section>
                <h2 class="section-title">Hubungi Saya</h2>
                
                <form action="#" method="POST">
                    <div class="form-group">
                        <label for="nama">Nama Lengkap:</label>
                        <input type="text" id="nama" name="nama" placeholder="Masukkan nama Anda" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Alamat Email:</label>
                        <input type="email" id="email" name="email" placeholder="nama@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="kategori">Kategori / Keperluan:</label>
                        <select id="kategori" name="kategori">
                            <option value="kolaborasi">Kolaborasi Proyek</option>
                            <option value="umum">Pertanyaan Umum</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="pesan">Pesan:</label>
                        <textarea id="pesan" name="pesan" rows="5" placeholder="Tuliskan pesan Anda..." required></textarea>
                    </div>

                    <button type="submit">Kirim Pesan</button>
                </form>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Afry Zacky.</p>
        </footer>
    </div>

</body>
</html>
